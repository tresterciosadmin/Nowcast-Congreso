# =============================================================================
# ⛔ NO USAR — ARCHIVO A BORRAR
#
# Duplica el workflow "Bot diario (padrón vivo)" que YA VIENE CORRIENDO desde
# julio (corrida #22 al 04-08-2026). Se creó por error el 04-08 porque el
# entorno de Claude monta la carpeta sin exponer los directorios que empiezan
# con punto, así que no vio el `.github/` que ya existía en la raíz del repo.
#
# **NEUTRALIZADO:** se le sacaron los disparadores automáticos. Sólo queda el
# botón manual, y aunque se apriete no hace nada. No puede pisar al bot real.
#
# Copia en `Archivos_Borrar/BORRAR_github-workflows-bot-diario.yml`.
# Anotado en `Archivos_Borrar/PENDIENTES-DE-BORRAR.md`.
#
# ── Lo único que valía rescatar (dos mejoras que el bot real no tiene) ───────
# 1. AVISO DE CANÓNICA PENDIENTE. El bot detecta actas nuevas, pero
#    `run_pipeline.py` no corre solo: las actas quedan en un parquet que el
#    modelo no mira. La mejora abre un issue con los comandos exactos, y no
#    duplica si ya hay uno abierto con la etiqueta `canonica-pendiente`.
# 2. CREAR EL LABEL SI NO EXISTE. `issues.create` con un label inexistente
#    falla, y el aviso se pierde en silencio — lo peor que le puede pasar a
#    algo cuyo único trabajo es avisar.
#    El código de las dos está en la copia de Archivos_Borrar.
# =============================================================================
name: "⛔ NO USAR - borrar (duplicado de Bot diario)"

on:
  workflow_dispatch:

jobs:
  aviso:
    runs-on: ubuntu-latest
    steps:
      - name: Este workflow no hace nada
        run: |
          echo "Duplicado del bot diario real. No corre nada."
          echo "Borrar este archivo: .github/workflows/bot-diario.yml"
          echo "Ver Archivos_Borrar/PENDIENTES-DE-BORRAR.md"
