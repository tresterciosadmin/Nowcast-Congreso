<!DOCTYPE html>
<!-- ================================================================
  MAPA DEL MODELO — Nowcast Legislativo Argentino
  De dónde sale la probabilidad de que un proyecto de ley sea aprobado.

  Este archivo es el DISEÑO. Ningún dato vive acá.
  Los datos viven en mapa_modelo_datos.js (mismo directorio), que
  GENERA producto/dashboard/src/generar_mapa_modelo.py a partir de
  .mapa/mapa.json + rutas.py + los README de cada módulo + la capa
  curada producto/dashboard/data/mapa_modelo_semantica.json.
  Mismo patrón que TABLERO-CONTROL.html + tablero_datos.js.

  Se abre con doble click; no necesita servidor ni internet.
  Sin CDN y sin fetch, a propósito: con fetch, file:// se rompe por CORS.

  NO es el tablero: TABLERO-CONTROL.html muestra plan y avance,
  esto muestra la maquinaria.

  V2 (2026-08-20). Misma estructura que la V1, otro dibujo. El requisito
  es el ORDEN, no la estética: una banda por cámara, cada una con su flujo
  COMPLETO de punta a punta.

    banda 1 (arriba) ....... todo el flujo hasta P(aprobación en ORIGEN)
    banda 2 (abajo)  ....... todo el flujo hasta P(aprobación en REVISORA)
    a la derecha, entre las dos ... P(aprobación de un proyecto de ley)

  Las dos bandas comparten la MISMA grilla de columnas, así que el mismo
  nodo cae en la misma vertical arriba y abajo y el espejo se ve solo.
  El condicionamiento entre cámaras es una flecha corta y gruesa que baja
  de un resultado al otro, no un arco por encima de todo.
  El layout se calcula acá abajo, en JS. Sin CDN y sin fetch.
================================================================= -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa del Modelo (V2) — Nowcast Legislativo</title>
<style>
  /* Paleta base heredada de TABLERO-CONTROL.html (el estilo de la casa).
     El color codifica el ROL. El ESTADO se codifica con borde y opacidad,
     nunca con color de relleno: nada depende sólo del color. */
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel2:#fbfcfd; --ink:#1a2233; --muted:#5b6577;
    --line:#e3e7ee; --line2:#c9d1de; --brand:#1e3a5f; --brand2:#2e6da4;
    --sombra:0 1px 3px rgba(16,24,40,.08),0 6px 18px rgba(16,24,40,.06);

    --hecho:#1e7d46; --hecho-bg:#e3f4ea;
    --curso:#b97a00; --curso-bg:#fdf3dd;
    --parcial:#8a6d00; --parcial-bg:#faf6e0;
    --pend:#7a4ec2;  --pend-bg:#f0eafb;
    --futuro:#5b6577; --futuro-bg:#eef0f4;
    --repl:#b3403f;  --repl-bg:#fdeaea;

    --rol-fuente:#2e6da4;    --rol-fuente-bg:#dbe8f5;
    --rol-script:#7a4ec2;    --rol-script-bg:#ece3fa;
    --rol-dato:#12796b;      --rol-dato-bg:#d8f0eb;
    --rol-variable:#b0561a;  --rol-variable-bg:#fbe7d6;
    --rol-resultado:#1e3a5f; --rol-resultado-bg:#e8edf4;

    --arista:#8d99ab; --arista-fuerte:#5b6577;
    --alerta:#b3403f; --resalte:#b97a00;
    --condiciona:#0d7c8f;
    --grupo:#0d8a9e; --grupo-bg:rgba(13,138,158,.12);
    --marco:#eef1f6; --marco-linea:#dbe1ea; --marco-rev:#edf3f5; --marco-rev-linea:#d3e2e6;
    --foco:#2e6da4;
  }
  [data-tema="oscuro"]{
    --bg:#11151d; --panel:#1a202b; --panel2:#151b24; --ink:#e6ebf3; --muted:#98a3b4;
    --line:#2a3342; --line2:#3a4557; --brand:#8fbbe8; --brand2:#6aa5dc;
    --sombra:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);

    --hecho:#5fd08e; --hecho-bg:#123021;
    --curso:#e5ab3c; --curso-bg:#332609;
    --parcial:#d8c45a; --parcial-bg:#2e2a0d;
    --pend:#b799ef;  --pend-bg:#241b3a;
    --futuro:#98a3b4; --futuro-bg:#232a36;
    --repl:#ef8483;  --repl-bg:#3a1c1c;

    --rol-fuente:#6fa8dc;    --rol-fuente-bg:#16293c;
    --rol-script:#b596f2;    --rol-script-bg:#241b3a;
    --rol-dato:#45c5ab;      --rol-dato-bg:#0e2f2a;
    --rol-variable:#e79a5a;  --rol-variable-bg:#38220f;
    --rol-resultado:#cfe0f2; --rol-resultado-bg:#1d2836;

    --arista:#5c6a7e; --arista-fuerte:#93a1b5;
    --alerta:#ef8483; --resalte:#e5ab3c;
    --condiciona:#5fd3e6;
    --grupo:#39c2d8; --grupo-bg:rgba(57,194,216,.14);
    --marco:#161c26; --marco-linea:#232b38; --marco-rev:#141e22; --marco-rev-linea:#1f2f34;
    --foco:#6aa5dc;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.5;
       display:flex;flex-direction:column;min-height:100vh}

  /* ------------------------------------------------- la única barra de arriba */
  /* Es instrumental y nada más: buscar, filtrar, seguir un camino, encuadrar.
     No hay título, ni subtítulo, ni franja de fórmulas: esto es una herramienta
     interna, no una presentación. El lienzo arranca en el primer píxel. */
  .barra{position:sticky;top:0;z-index:20;background:var(--panel);
         border-bottom:1px solid var(--line);padding:5px 12px;flex:0 0 auto;
         display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;box-shadow:var(--sombra)}
  .grupo{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .grupo > .et{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;
               color:var(--muted);font-weight:700;margin-right:2px}
  .chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;
        padding:2px 9px;font-size:.74rem;cursor:pointer;color:var(--muted);
        font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
  .chip:hover{border-color:var(--brand2);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip .pin{width:9px;height:9px;flex:0 0 auto;display:inline-block}
  .chip.rol-fuente .pin{background:var(--rol-fuente)}
  .chip.rol-script .pin{background:var(--rol-script);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
  .chip.rol-dato .pin{background:var(--rol-dato)}
  .chip.rol-variable .pin{background:var(--rol-variable);border-radius:50%}
  .chip.rol-resultado .pin{background:var(--rol-resultado);outline:2px solid var(--rol-resultado);outline-offset:-1px}
  .chip[aria-pressed="true"] .pin{outline:1px solid rgba(255,255,255,.7)}

  input[type="search"]{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);
        border-radius:8px;padding:4px 10px;font-size:.82rem;min-width:190px;font-family:inherit}
  input[type="search"]:focus{outline:2px solid var(--foco);outline-offset:1px}
  select{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);
         border-radius:8px;padding:4px 8px;font-size:.79rem;font-family:inherit;font-weight:600}
  .btn{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;
       padding:4px 9px;font-size:.79rem;cursor:pointer;color:var(--ink);
       font-weight:600;font-family:inherit;min-width:30px}
  .btn:hover{border-color:var(--brand2)}
  .btn[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
  .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  :focus-visible{outline:2px solid var(--foco);outline-offset:2px;border-radius:4px}

  /* ---------------------------------------------------------- lienzo */
  .cuerpo{flex:0 0 auto;display:flex;min-height:420px;position:relative}
  .lienzo{flex:1 1 auto;position:relative;overflow:hidden;background:var(--bg);min-height:420px}
  .lienzo:fullscreen{background:var(--bg);height:100vh}
  #svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #svg.arrastrando{cursor:grabbing}

  /* marcos de bloque: el esqueleto bicameral es el dibujo, no un detalle */
  .marco{fill:var(--marco);stroke:none}
  .marco.b-revisora{fill:var(--marco-rev)}
  .marco.b-fuera{fill:none;stroke:var(--marco-linea);stroke-dasharray:6 5}
  .marco.b-final{fill:var(--marco);stroke:var(--marco-linea)}
  .rejilla{stroke:var(--marco-linea);stroke-width:1;opacity:.7}
  .cabCol{fill:var(--panel2);stroke:var(--marco-linea);stroke-width:1}
  .cabColTxt{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
             fill:var(--muted)}
  .bandaTit{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
            fill:var(--brand);opacity:.8}
  .bandaSub{font-size:10.5px;fill:var(--muted)}
  .bandaNum{font-size:20px;font-weight:800;fill:var(--brand);opacity:.22}
  .grupoCaja{fill:var(--grupo-bg);stroke:var(--grupo);stroke-width:2;rx:18}
  .grupoTit{font-size:11px;font-weight:800;fill:var(--grupo);letter-spacing:.03em}

  .nodo{cursor:pointer}
  .nodo .forma{stroke-width:1.7;transition:opacity .15s}
  .nodo.r-resultado .forma{stroke-width:4.5}
  .nodo .rotulo{font-size:11px;fill:var(--ink);pointer-events:none;font-weight:600}
  .nodo.r-resultado .rotulo{font-size:12.5px;font-weight:800}
  .nodo .sub{font-size:9px;fill:var(--muted);pointer-events:none;font-weight:600}
  .nodo:focus{outline:none}
  .nodo:focus .halo,.nodo.sel .halo{opacity:1}
  .halo{fill:none;stroke:var(--foco);stroke-width:2.5;opacity:0;stroke-dasharray:3 3}
  .nodo.apagado{opacity:.12}
  .nodo.apagado .rotulo,.nodo.apagado .sub{opacity:.5}
  .nodo.parqueada .forma{stroke-dasharray:5 4}
  .nodo.enCamino .forma{stroke:var(--resalte);stroke-width:3.5}
  .gemelo{fill:var(--muted);font-size:9px;font-weight:800;opacity:.7;pointer-events:none}

  .arista{fill:none;stroke:var(--arista);stroke-width:1.5;stroke-opacity:.75}
  .arista.t-config{stroke:var(--line2);stroke-width:1.4;stroke-dasharray:5 4;opacity:.75}
  .arista.t-calcula{stroke:var(--arista-fuerte);stroke-width:1.9;stroke-opacity:.9}
  .arista.t-alerta{stroke:var(--alerta);stroke-width:1.5;stroke-dasharray:7 4;opacity:.5}
  .arista.t-condiciona{stroke:var(--condiciona);stroke-width:6;stroke-linecap:round}
  .arista.atras{stroke-dasharray:5 4}
  .arista.lejos{stroke-opacity:.3}
  .arista.apagada{opacity:.05}
  .arista.viva{stroke:var(--resalte);stroke-width:3;opacity:1}
  .rotArista{font-size:11.5px;font-weight:700;fill:var(--condiciona)}
  .rotFondo{fill:var(--bg);opacity:.92;stroke:var(--condiciona);stroke-opacity:.25}

  /* ---------------------------------------------------------- ficha */
  /* Lo más útil de la página: click en un nodo y acá está de dónde sale.
     Se agranda con lo que liberó el header. */
  .ficha{flex:0 0 424px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);
         overflow-y:auto;padding:14px 18px 40px;display:none}
  .ficha.on{display:block}
  .ficha h2{margin:0 0 2px;font-size:1.08rem;line-height:1.3}
  .ficha .cerrar{float:right;margin:-2px -4px 0 8px}
  .ficha .qes{color:var(--ink);font-size:.9rem;margin:10px 0 12px}
  .ficha h3{font-size:.71rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
            margin:16px 0 5px;font-weight:800}
  .ficha ul{margin:4px 0;padding-left:17px;font-size:.85rem;color:var(--ink)}
  .ficha li{margin-bottom:5px}
  .ficha .vinculo{background:none;border:0;padding:0;font:inherit;font-size:.85rem;
                  color:var(--brand2);cursor:pointer;text-align:left;font-weight:600}
  .ficha .vinculo:hover{text-decoration:underline}
  .ficha .via{color:var(--muted);font-weight:400;font-size:.78rem}
  code,.mono{font-family:"Cascadia Mono",Consolas,"SF Mono",monospace;font-size:.8rem;
       background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
       overflow-wrap:anywhere}
  .formula{display:block;background:var(--panel2);border:1px solid var(--line);
           border-left:4px solid var(--brand2);border-radius:0 8px 8px 0;padding:9px 12px;
           margin:8px 0;font-family:"Cascadia Mono",Consolas,monospace;font-size:.82rem}
  .nota{border-left:3px solid var(--curso);background:var(--curso-bg);color:var(--ink);
        padding:7px 11px;border-radius:0 6px 6px 0;font-size:.83rem;margin-bottom:7px}
  .nota.mala{border-left-color:var(--repl);background:var(--repl-bg)}
  .nota.cond{border-left-color:var(--grupo);background:var(--grupo-bg)}

  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;
         font-weight:800;letter-spacing:.03em;vertical-align:middle;margin:2px 4px 2px 0;
         border:1px solid transparent;white-space:nowrap}
  .e-HECHO{color:var(--hecho);background:var(--hecho-bg);border-color:var(--hecho)}
  .e-ENCURSO{color:var(--curso);background:var(--curso-bg);border-color:var(--curso)}
  .e-PARCIAL{color:var(--parcial);background:var(--parcial-bg);border-color:var(--parcial)}
  .e-PENDIENTE{color:var(--pend);background:var(--pend-bg);border-color:var(--pend);border-style:dashed}
  .e-FUTURO{color:var(--futuro);background:var(--futuro-bg);border-color:var(--futuro);border-style:dashed}
  .e-REPLANTEADO{color:var(--repl);background:var(--repl-bg);border-color:var(--repl);border-style:dashed}
  .e-{color:var(--muted);background:var(--futuro-bg);border-color:var(--line2);border-style:dotted}
  .b-susp{color:var(--repl);background:var(--repl-bg);border-color:var(--repl)}
  .b-comp{color:var(--muted);background:var(--futuro-bg);border-color:var(--line2)}
  .rolbadge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:800}
  .r-fuente{color:var(--rol-fuente);background:var(--rol-fuente-bg)}
  .r-script{color:var(--rol-script);background:var(--rol-script-bg)}
  .r-dato{color:var(--rol-dato);background:var(--rol-dato-bg)}
  .r-variable{color:var(--rol-variable);background:var(--rol-variable-bg)}
  .r-resultado{color:var(--rol-resultado);background:var(--rol-resultado-bg);
               border:1.5px solid var(--rol-resultado)}

  /* ---------------------------------------------------------- tabla */
  /* En la vista de tabla scrollea la PAGINA, no un contenedor interno: si no,
     la tabla queda encerrada en la franja que sobra y no se lee nada. */
  .tabla{display:none;padding:16px 22px 34px;flex:0 0 auto}
  body[data-vista="tabla"] .tabla{display:block}
  body[data-vista="tabla"] .cuerpo{display:none}
  .tabla h2{font-size:1.05rem;color:var(--brand);margin:22px 0 8px}
  .tabla h2:first-child{margin-top:0}
  .tabla p.ayuda{color:var(--muted);font-size:.85rem;margin:0 0 10px;max-width:70ch}
  table{width:100%;border-collapse:collapse;background:var(--panel);font-size:.83rem;
        border:1px solid var(--line);border-radius:10px;overflow:hidden;table-layout:fixed}
  td{overflow-wrap:anywhere}
  caption{text-align:left;color:var(--muted);font-size:.8rem;padding:0 0 6px}
  th{background:var(--brand);color:#fff;text-align:left;padding:8px 10px;font-weight:600;
     font-size:.76rem}
  td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr:nth-child(even) td{background:var(--panel2)}

  /* ---------------------------------------------------------- leyenda */
  footer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
         padding:11px 20px 16px;font-size:.79rem;color:var(--muted)}
  .leyendas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 22px}
  .ley h4{margin:0 0 5px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;
          color:var(--muted);font-weight:800}
  .ley div{margin-bottom:3px;display:flex;align-items:center;gap:7px;line-height:1.35}
  .ley svg{flex:0 0 auto}
  /* Las dos formulaciones viven acá: siguen estando enteras, pero en chico y sin
     jerarquía de titular. Que sean DOS es el punto; que griten, no. */
  .ley .form{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;background:var(--panel2);
             cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);display:block;
             width:100%;margin-bottom:5px;font-size:.75rem;line-height:1.35}
  .ley .form:hover{border-color:var(--brand2)}
  .ley .form[aria-pressed="true"]{border-color:var(--resalte);box-shadow:0 0 0 2px var(--curso-bg)}
  .ley .form .n{font-weight:800;display:block}
  .ley .form .f{font-family:"Cascadia Mono",Consolas,monospace;color:var(--brand2);display:block;
                margin:2px 0;overflow-wrap:anywhere}
  .ley .form .d{color:var(--muted);display:block}
  .pie{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:.75rem}
  .aviso{background:var(--repl-bg);color:var(--repl);border:1px solid var(--repl);
         border-radius:8px;padding:8px 12px;font-size:.8rem;margin:10px 0;font-weight:600}
  body[data-extra="off"] .b-fuera-grupo{display:none}
  .solo-lectores{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media(max-width:900px){
    .ficha{position:absolute;right:0;top:0;bottom:0;z-index:15;box-shadow:var(--sombra);flex-basis:340px}
    .lienzo{min-height:460px}
  }
</style>
</head>
<body data-tema="claro" data-vista="grafo" data-extra="off">

<div class="barra" role="toolbar" aria-label="Instrumentos del mapa">
  <div class="grupo">
    <label class="solo-lectores" for="q">Buscar en el mapa</label>
    <input type="search" id="q" placeholder="Buscar nodo, archivo, módulo…"
           aria-label="Buscar nodo, archivo o módulo">
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="grupo" id="chips-etapa" role="group" aria-label="Filtrar por etapa">
    <span class="et" aria-hidden="true">Etapa</span>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="grupo" id="chips-rol" role="group" aria-label="Filtrar por rol">
    <span class="et" aria-hidden="true">Rol</span>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="grupo">
    <label class="solo-lectores" for="camino">Seguir un camino</label>
    <select id="camino" aria-label="Resaltar un camino completo"></select>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="grupo" role="group" aria-label="Zoom y encuadre">
    <button class="btn" id="b-mas" aria-label="Acercar" title="Acercar (+)">+</button>
    <button class="btn" id="b-menos" aria-label="Alejar" title="Alejar (−)">−</button>
    <button class="btn" id="b-ajustar" title="Ajustar a la ventana (0)">Ajustar</button>
    <button class="btn" id="b-reordenar" title="Reordenar: reacomoda las filas para cruzar menos líneas">Reordenar</button>
    <button class="btn" id="b-pantalla" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="grupo">
    <button class="btn" id="b-extra" aria-pressed="false"
            title="Mostrar u ocultar lo que no entra al número: controles, exports y evaluación">Controles: no</button>
    <button class="btn" id="b-tema" aria-label="Alternar tema claro y oscuro">Tema oscuro</button>
    <button class="btn" id="b-vista" aria-pressed="false"
            aria-label="Alternar entre el grafo y la tabla gemela">Ver tabla</button>
  </div>
</div>

<div class="cuerpo">
  <div class="lienzo" id="lienzo">
    <svg id="svg" role="img" aria-labelledby="svg-titulo svg-desc">
      <title id="svg-titulo">Flujo del cálculo del Nowcast, una banda por cámara</title>
      <desc id="svg-desc">Diagrama de flujo de izquierda a derecha, en dos bandas apiladas que
        comparten la misma grilla de columnas. La banda de arriba es el flujo completo hasta la
        probabilidad de aprobación en la cámara de origen; la de abajo, el flujo completo hasta la
        probabilidad de aprobación en la cámara revisora, condicionada por la primera. A la derecha,
        entre las dos, confluyen en la probabilidad de aprobación de un proyecto de ley.
        La misma información está disponible en formato de tabla con el botón «Ver tabla».</desc>
      <defs id="defs"></defs>
      <g id="raiz">
        <g id="capaMarcos"></g>
        <g id="capaRejilla"></g>
        <g id="capaGrupos"></g>
        <g id="capaAristas"></g>
        <g id="capaNodos"></g>
      </g>
    </svg>
  </div>
  <aside class="ficha" id="ficha" role="complementary" aria-live="polite" aria-label="Ficha del nodo"></aside>
</div>

<div class="tabla" id="tabla"></div>

<footer>
  <div class="leyendas" id="leyenda"></div>

<script src="mapa_modelo_datos.js"></script>
<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ arranque */
if (typeof MAPA_MODELO === "undefined") {
  document.body.innerHTML =
    '<div style="padding:40px;font-family:system-ui">' +
    '<h1>Falta <code>mapa_modelo_datos.js</code></h1>' +
    '<p>Este archivo es sólo el diseño. Corré, desde la raíz del proyecto:</p>' +
    '<pre>python producto/dashboard/src/generar_mapa_modelo.py</pre></div>';
  return;
}
var D = MAPA_MODELO;
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
};
var NS = "http://www.w3.org/2000/svg";
var el = function(tag, attrs){
  var n = document.createElementNS(NS, tag);
  for (var k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  return n;
};

var NODOS = D.nodes.slice();
var IDX = {}; NODOS.forEach(function(n){ IDX[n.id] = n; });
var LINKS = D.links.slice();
var ORDEN_ETAPA = {}; D.etapas.forEach(function(e){ ORDEN_ETAPA[e.id] = e.orden; });
var NOM_ETAPA = {}; D.etapas.forEach(function(e){ NOM_ETAPA[e.id] = e.nombre; });
var DESC_ETAPA = {}; D.etapas.forEach(function(e){ DESC_ETAPA[e.id] = e.descripcion; });
var NOM_ROL = {}; D.roles.forEach(function(r){ NOM_ROL[r.id] = r.nombre; });
var FORMA_ROL = {}; D.roles.forEach(function(r){ FORMA_ROL[r.id] = r.forma || "circulo"; });
var NOM_TIPO = {}; D.tipos_arista.forEach(function(t){ NOM_TIPO[t.id] = t.nombre; });
var GRUPOS = {}; (D.grupos||[]).forEach(function(g){ GRUPOS[g.id] = g; });

/* vecinos, para la ficha y para el resaltado */
var ENTRAN = {}, SALEN = {};
LINKS.forEach(function(l){
  (SALEN[l.de] = SALEN[l.de] || []).push(l);
  (ENTRAN[l.a] = ENTRAN[l.a] || []).push(l);
});

var S = {
  etapas: new Set(D.etapas.map(function(e){ return e.id; })),
  roles:  new Set(D.roles.map(function(r){ return r.id; })),
  q: "", sel: null, camino: "",
  z: 1, px: 0, py: 0
};

/* ================================================================= BLOQUES ==
   El esqueleto del dibujo es bicameral. La capa curada declara el bloque sólo
   en la PUNTA de cada cadena (`bloque`: origen / revisora / final / fuera);
   de todo lo que está más arriba se ocupa esto, por alcance hacia atrás.

   Un nodo que alimenta a las DOS cámaras -la canónica, el padrón, casi toda la
   ingesta- se dibuja de los DOS lados, marcado como compartido. Es lo que pidió
   el croquis: cada bloque muestra su cadena entera, para poder seguirla con el
   dedo sin saltar de un lado al otro. Que sean el mismo nodo se ve en la marca
   de compartido, en la ficha, y en que al seleccionarlo se encienden las dos.

   La expansión NO atraviesa un nodo declarado de otro bloque: por eso la cadena
   de la revisora no se traga la de origen a través de `g_B -> g_C`. */
var BLOQUES = [
  { id:"origen",   nombre:"Cámara de origen",  sub:DESC_ETAPA["origen"]   || "" },
  { id:"revisora", nombre:"Cámara revisora",   sub:DESC_ETAPA["revisora"] || "" },
  { id:"final",    nombre:"El número publicado", sub:DESC_ETAPA["nowcast"] || "" },
  { id:"fuera",    nombre:"Fuera de la cadena de un proyecto",
    sub:"Controles, exports y evaluación: no entran al número, lo vigilan." }
];
var DECL = {};
NODOS.forEach(function(n){ if (n.bloque) DECL[n.id] = n.bloque; });

var PRED = {};
LINKS.forEach(function(l){ (PRED[l.a] = PRED[l.a] || []).push(l.de); });

function ancestros(bloque){
  var semillas = NODOS.filter(function(n){ return DECL[n.id] === bloque; })
                      .map(function(n){ return n.id; });
  var vistos = new Set(semillas), pila = semillas.slice();
  while (pila.length){
    var x = pila.pop();
    (PRED[x] || []).forEach(function(p){
      if (vistos.has(p)) return;
      if (DECL[p] && DECL[p] !== bloque) return;   /* no se atraviesa otro bloque */
      vistos.add(p); pila.push(p);
    });
  }
  return vistos;
}
var ANC_O = ancestros("origen"), ANC_R = ancestros("revisora");

var MIEMBRO = {};   /* id -> [bloques donde se dibuja] */
NODOS.forEach(function(n){
  if (DECL[n.id]) { MIEMBRO[n.id] = [DECL[n.id]]; return; }
  var b = [];
  if (ANC_O.has(n.id)) b.push("origen");
  if (ANC_R.has(n.id)) b.push("revisora");
  MIEMBRO[n.id] = b.length ? b : ["fuera"];
});

/* ---------------------------------------------------- instancias y aristas */
function clave(id, b){ return b + " " + id; }
var INST = [], POR_CLAVE = {}, POR_ID = {};
NODOS.forEach(function(n){
  MIEMBRO[n.id].forEach(function(b){
    var it = { n:n, id:n.id, bloque:b, clave:clave(n.id,b),
               compartido: MIEMBRO[n.id].length > 1,
               x:0, y:0, w:0, h:0, capa:0, g:null };
    INST.push(it); POR_CLAVE[it.clave] = it;
    (POR_ID[n.id] = POR_ID[n.id] || []).push(it);
  });
});

var ARISTAS = [];
LINKS.forEach(function(l, i){
  MIEMBRO[l.a].forEach(function(b){
    var bd = MIEMBRO[l.de].indexOf(b) >= 0 ? b : MIEMBRO[l.de][0];
    var de = POR_CLAVE[clave(l.de, bd)], a = POR_CLAVE[clave(l.a, b)];
    if (!de || !a || de === a) return;
    ARISTAS.push({ l:l, i:i, de:de, a:a, tipo:l.tipo,
                   cruza: de.bloque !== a.bloque });
  });
});

/* =================================================================== LAYOUT ==
   Capas por PROFUNDIDAD REAL, no por columna fija: un nodo va una capa a la
   derecha de su entrada más profunda. Sólo cuentan las aristas de flujo y de
   cálculo; las de config y las de alerta no empujan a nadie hacia la derecha
   -son parametrización y realimentación- y por eso terminan dibujadas como
   líneas punteadas, muchas veces hacia atrás. Es justo lo que se quiere ver. */
var GAP_CAPA = 46, GAP_FILA = 15, GAP_BLOQUE = 84, ESCALON = 14;
var ARCO_Y = 18, MARGEN = 34;

var cvs = document.createElement("canvas").getContext("2d");
function anchoTexto(s, peso, px){
  cvs.font = peso + " " + px + 'px "Segoe UI",system-ui,-apple-system,sans-serif';
  return cvs.measureText(String(s == null ? "" : s)).width;
}
function envolver(txt, maxPx, peso, px, maxLineas){
  var pal = String(txt || "").split(/\s+/), lineas = [], act = "";
  pal.forEach(function(p){
    var t = act ? act + " " + p : p;
    if (act && anchoTexto(t, peso, px) > maxPx){ lineas.push(act); act = p; }
    else act = t;
  });
  if (act) lineas.push(act);
  if (lineas.length > maxLineas){
    lineas = lineas.slice(0, maxLineas);
    var u = lineas[maxLineas-1];
    while (u.length > 4 && anchoTexto(u + "…", peso, px) > maxPx) u = u.slice(0, -1);
    lineas[maxLineas-1] = u + "…";
  }
  return lineas;
}

function medir(it){
  var n = it.n, res = n.rol === "resultado";
  var px = res ? 12.5 : 11, peso = res ? "800" : "600";
  var maxTxt = res ? 186 : 136;
  it.lineas = envolver(n.label, maxTxt, peso, px, res ? 3 : 2);
  it.sublineas = n.sublabel ? envolver(n.sublabel, maxTxt, "600", 9, 2) : [];
  var wtxt = 0;
  it.lineas.forEach(function(s){ wtxt = Math.max(wtxt, anchoTexto(s, peso, px)); });
  it.sublineas.forEach(function(s){ wtxt = Math.max(wtxt, anchoTexto(s, "600", 9)); });
  var forma = FORMA_ROL[n.rol];
  var padX = forma === "hexagono" ? 46 : forma === "circulo" ? 42 : 26;
  var alto = it.lineas.length * 14 + it.sublineas.length * 11 + 18;
  it.w = Math.ceil(wtxt + padX);
  it.h = Math.max(forma === "circulo" ? 46 : 36, Math.ceil(alto));
  if (forma === "circulo") it.h += 6;
  if (n.jerarquia >= 3) it.w = Math.max(it.w, 116);
}
INST.forEach(medir);

/* --------------------------------------------------------- capas por bloque */
var PORBLOQUE = {};
BLOQUES.forEach(function(b){ PORBLOQUE[b.id] = []; });
INST.forEach(function(it){ PORBLOQUE[it.bloque].push(it); });

function empuja(a){ return a.tipo === "flujo" || a.tipo === "calcula"; }

function calcularCapas(lista){
  var dentro = new Set(lista.map(function(i){ return i.clave; }));
  var ent = {}, sal = {}, gradoE = {};
  lista.forEach(function(i){ ent[i.clave] = []; sal[i.clave] = []; gradoE[i.clave] = 0; });
  ARISTAS.forEach(function(a){
    if (!empuja(a) || !dentro.has(a.de.clave) || !dentro.has(a.a.clave)) return;
    if (a.de.clave === a.a.clave) return;
    ent[a.a.clave].push(a.de.clave); sal[a.de.clave].push(a.a.clave);
    gradoE[a.a.clave]++;
  });
  /* Kahn: la capa es el camino más largo desde una raíz. Si quedara un ciclo
     (no debería, pero el mapa crece), lo que sobra cae por orden de etapa y el
     dibujo sigue en pie en vez de colgarse. */
  var cola = lista.filter(function(i){ return gradoE[i.clave] === 0; })
                  .map(function(i){ return i.clave; });
  var capa = {}; lista.forEach(function(i){ capa[i.clave] = 0; });
  var visto = 0;
  while (cola.length){
    var c = cola.shift(); visto++;
    sal[c].forEach(function(s){
      capa[s] = Math.max(capa[s], capa[c] + 1);
      if (--gradoE[s] === 0) cola.push(s);
    });
  }
  if (visto < lista.length){
    lista.forEach(function(i){
      if (gradoE[i.clave] > 0) capa[i.clave] = (ORDEN_ETAPA[i.n.etapa] || 0);
    });
  }
  lista.forEach(function(i){ i.capa = capa[i.clave]; });
}
BLOQUES.forEach(function(b){ calcularCapas(PORBLOQUE[b.id]); });

/* ------------------------------------- orden vertical dentro de cada capa */
/* Barrido de baricentro: cada nodo se acerca a la mediana de sus vecinos de la
   capa de al lado. Es el heurístico clásico para cruzar menos líneas; no busca
   el óptimo, y por eso existe el botón «Reordenar». */
var COLS = {};   /* bloque -> [[inst,...] por capa] */

function armarColumnas(lista, bloqueId){
  var maxc = 0;
  lista.forEach(function(i){ maxc = Math.max(maxc, i.capa); });
  var cols = [];
  for (var c = 0; c <= maxc; c++) cols.push([]);
  lista.forEach(function(i){ cols[i.capa].push(i); });
  cols.forEach(function(col){
    col.sort(function(a,b){
      return (ORDEN_ETAPA[a.n.etapa] - ORDEN_ETAPA[b.n.etapa]) ||
             a.n.label.localeCompare(b.n.label, "es");
    });
  });
  COLS[bloqueId] = cols;
  return cols;
}

function ordenar(bloqueId, pasadas){
  var cols = COLS[bloqueId];
  if (!cols || !cols.length) return;
  var dentro = new Set();
  cols.forEach(function(col){ col.forEach(function(i){ dentro.add(i.clave); }); });

  var ent = {}, sal = {};
  ARISTAS.forEach(function(a){
    if (!dentro.has(a.de.clave) || !dentro.has(a.a.clave)) return;
    (ent[a.a.clave] = ent[a.a.clave] || []).push(a.de);
    (sal[a.de.clave] = sal[a.de.clave] || []).push(a.a);
  });

  var pos = {};
  cols.forEach(function(col){ col.forEach(function(i, k){ pos[i.clave] = k; }); });

  function bari(it, ref){
    var vs = (ref[it.clave] || []).map(function(o){ return pos[o.clave]; })
                                  .filter(function(v){ return v != null; });
    if (!vs.length) return null;
    vs.sort(function(a,b){ return a-b; });
    return vs[Math.floor(vs.length/2)];
  }

  for (var p = 0; p < pasadas; p++){
    var ida = p % 2 === 0;
    var rango = cols.map(function(_, i){ return ida ? i : cols.length-1-i; });
    rango.forEach(function(ci){
      var col = cols[ci], ref = ida ? ent : sal;
      var claves = col.map(function(it, k){
        var b = bari(it, ref);
        return { it:it, k: b == null ? k : b, i:k };
      });
      claves.sort(function(a,b){ return (a.k - b.k) || (a.i - b.i); });
      cols[ci] = claves.map(function(c){ return c.it; });
      cols[ci].forEach(function(it, k){ pos[it.clave] = k; });
    });
  }
}

/* =================================================================== V2 ====
   UNA BANDA POR CÁMARA, y las dos sobre la MISMA grilla de columnas.

   La banda de arriba es el flujo completo hasta P(aprobación en origen); la de
   abajo, el flujo completo hasta P(aprobación en revisora). Como las columnas
   son las mismas para las dos, el mismo nodo cae en la misma vertical arriba y
   abajo: el espejo se ve sin que haya que decirlo, y la columna dice en qué
   etapa del cálculo estás parado.

   Apilar en vez de poner los bloques lado a lado no es un gusto: dos cadenas de
   diez columnas una al lado de la otra dan un dibujo del triple de ancho que de
   alto, y «Ajustar» lo deja ilegible. Apiladas, el dibujo entra en la pantalla
   con la forma de la pantalla.

   El número final va a la DERECHA, a la misma altura que la juntura de las dos
   bandas: las dos cadenas terminan apuntando al mismo lugar. */
var GAP_COL = 54, GAP_FILA = 14, GAP_BANDA = 76, GAP_FINAL = 86;
/* Una columna con catorce fuentes apiladas deja la banda altísima y flaca, y
   «Ajustar» la achica hasta que no se lee. Cuando una columna pasa de MAX_FILAS
   se abre en sub-columnas DENTRO de la misma columna de la grilla: sigue siendo
   la misma etapa y las dos bandas siguen alineadas, pero ocupa el ancho que
   necesita en vez del alto que no hay. */
var MAX_FILAS = 8, SUB_GAP = 12;
var CAB_H = 26, TIT_H = 40, PAD_BANDA = 16, MARGEN = 34;

var GRID = { colX:[], colW:[], ancho:0, x0:0, y0:0, y1:0 };
var MARCOS = [], CAJAS = [], CABS = [], ANCHO = 0, ALTO = 0;

function disponer(){
  /* Las dos camaras no tienen la misma cantidad de capas (la revisora es mas
     corta). Si cada una terminara donde le toca, los dos resultados quedarian
     desalineados y el espejo se perderia. Se empuja el nodo `resultado` de cada
     banda a la ULTIMA columna de la grilla: las dos cadenas terminan a la misma
     altura, y esa columna final pasa a ser «el resultado de la camara». */
  var camaras = ["origen", "revisora"], maxc = 0;
  camaras.forEach(function(b){
    (PORBLOQUE[b] || []).forEach(function(it){ maxc = Math.max(maxc, it.capa); });
  });
  camaras.forEach(function(b){
    (PORBLOQUE[b] || []).forEach(function(it){
      if (it.n.rol === "resultado") it.capa = maxc;
    });
  });
  BLOQUES.forEach(function(b){
    armarColumnas(PORBLOQUE[b.id], b.id);
    ordenar(b.id, 12);
  });
  colocar();
}

/* apila una banda sobre la grilla compartida y devuelve su alto */
function altoDeColumna(col){
  var subs = Math.max(1, Math.ceil(col.length / MAX_FILAS));
  var filas = Math.ceil(col.length / subs), h = 0, k = 0;
  for (var f = 0; f < filas; f++){
    var alto = 0;
    for (var s = 0; s < subs; s++){
      var it = col[s * filas + f];
      if (it) alto = Math.max(alto, it.h);
    }
    h += alto + GAP_FILA;
  }
  return { h: Math.max(0, h - GAP_FILA), subs: subs, filas: filas };
}

function apilarBanda(bloqueId, x0, y0){
  var cols = COLS[bloqueId] || [];
  var altoMax = 0;
  cols.forEach(function(col){ altoMax = Math.max(altoMax, altoDeColumna(col).h); });
  cols.forEach(function(col, ci){
    var m = altoDeColumna(col);
    var anchoUsado = m.subs * GRID.colUnit[ci] + (m.subs - 1) * SUB_GAP;
    var xIni = x0 + GRID.colX[ci] + (GRID.colW[ci] - anchoUsado) / 2;
    var y = y0 + (altoMax - m.h) / 2;
    for (var f = 0; f < m.filas; f++){
      var alto = 0;
      for (var s = 0; s < m.subs; s++){
        var it = col[s * m.filas + f];
        if (it) alto = Math.max(alto, it.h);
      }
      for (var s2 = 0; s2 < m.subs; s2++){
        var it2 = col[s2 * m.filas + f];
        if (!it2) continue;
        it2.col = ci;
        it2.x = xIni + s2 * (GRID.colUnit[ci] + SUB_GAP) + GRID.colUnit[ci] / 2;
        it2.y = y + alto / 2;
      }
      y += alto + GAP_FILA;
    }
  });
  return altoMax;
}

/* mismo apilado pero con grilla propia: para lo que no es una cámara */
function apilarSuelto(bloqueId, x0, y0){
  var cols = COLS[bloqueId] || [];
  var x = 0, altoMax = 0;
  var anchos = cols.map(function(col){
    var w = 0; col.forEach(function(it){ w = Math.max(w, it.w); }); return w;
  });
  cols.forEach(function(col){
    var h = 0; col.forEach(function(it){ h += it.h + GAP_FILA; });
    altoMax = Math.max(altoMax, h - GAP_FILA);
  });
  cols.forEach(function(col, ci){
    var h = 0; col.forEach(function(it){ h += it.h + GAP_FILA; });
    h -= GAP_FILA;
    var y = y0 + (altoMax - h) / 2;
    col.forEach(function(it){
      it.col = -1;
      it.x = x0 + x + anchos[ci]/2;
      it.y = y + it.h/2;
      y += it.h + GAP_FILA;
    });
    x += anchos[ci] + GAP_COL;
  });
  return { w: Math.max(0, x - GAP_COL), h: altoMax };
}

function colocar(){
  /* --- 1. la grilla compartida: ancho de columna = el más ancho de las dos --- */
  var camaras = ["origen", "revisora"];
  var nCols = 0;
  camaras.forEach(function(b){ nCols = Math.max(nCols, (COLS[b]||[]).length); });
  GRID.colUnit = new Array(nCols).fill(0);
  var subs = new Array(nCols).fill(1);
  camaras.forEach(function(b){
    (COLS[b]||[]).forEach(function(col, ci){
      col.forEach(function(it){ GRID.colUnit[ci] = Math.max(GRID.colUnit[ci], it.w); });
      subs[ci] = Math.max(subs[ci], Math.ceil(col.length / MAX_FILAS));
    });
  });
  GRID.colW = GRID.colUnit.map(function(u, ci){
    return u * subs[ci] + (subs[ci] - 1) * SUB_GAP;
  });
  GRID.colX = []; var x = 0;
  for (var c = 0; c < nCols; c++){ GRID.colX.push(x); x += GRID.colW[c] + GAP_COL; }
  GRID.ancho = Math.max(0, x - GAP_COL);

  /* --- 2. las dos bandas, apiladas ---------------------------------------- */
  var x0 = MARGEN + 10;
  var yTop = MARGEN + CAB_H + 16;
  GRID.x0 = x0;

  var yO = yTop + TIT_H + PAD_BANDA;
  var hO = apilarBanda("origen", x0, yO);
  var yR = yO + hO + PAD_BANDA + GAP_BANDA + TIT_H + PAD_BANDA;
  var hR = apilarBanda("revisora", x0, yR);

  GRID.y0 = yTop;
  GRID.y1 = yR + hR + PAD_BANDA;

  MARCOS = [];
  MARCOS.push({ id:"origen", num:"1", nombre:"Cámara de origen",
    sub:"Todo el flujo hasta P(aprobación en la cámara donde nace el proyecto).",
    x: x0 - 14, y: yO - TIT_H - PAD_BANDA, w: GRID.ancho + 28,
    h: hO + TIT_H + 2*PAD_BANDA });
  MARCOS.push({ id:"revisora", num:"2", nombre:"Cámara revisora",
    sub:"El mismo flujo, en la otra cámara — y condicionado por lo que pasó en origen.",
    x: x0 - 14, y: yR - TIT_H - PAD_BANDA, w: GRID.ancho + 28,
    h: hR + TIT_H + 2*PAD_BANDA });

  /* --- 3. el número final: a la derecha, entre las dos bandas -------------- */
  var xF = x0 + GRID.ancho + GAP_FINAL;
  var mO = MARCOS[0], mR = MARCOS[1];
  var dimF = apilarSuelto("final", xF, 0);
  var yCentro = (mO.y + mO.h + mR.y) / 2;
  var dyF = yCentro - dimF.h/2;
  apilarSuelto("final", xF, dyF);   /* absoluto: colocar() se puede repetir */
  MARCOS.push({ id:"final", num:"3", nombre:"El número publicado",
    sub:"Las dos cámaras terminan acá.",
    x: xF - 16, y: dyF - TIT_H - 10, w: dimF.w + 32, h: dimF.h + TIT_H + 22 });

  /* --- 4. lo que no entra al número: abajo, y se puede plegar -------------- */
  var yX = Math.max(GRID.y1, MARCOS[2].y + MARCOS[2].h) + 64;
  var dimX = apilarSuelto("fuera", x0, yX + TIT_H);
  MARCOS.push({ id:"fuera", num:"", nombre:"Fuera de la cadena de un proyecto",
    sub:"Controles, exports y evaluación: no entran al número, lo vigilan.",
    x: x0 - 14, y: yX - 10, w: dimX.w + 28, h: dimX.h + TIT_H + 24 });

  /* --- 5. encabezados de columna: la etapa que domina cada vertical -------- */
  /* Un encabezado por TRAMO, no por columna: si tres columnas seguidas son
     todas «Variables», poner tres carteles que digan Variables es ruido. Se
     juntan en uno solo que las abarca. */
  CABS = [];
  var prev = null;
  for (var ci = 0; ci < nCols; ci++){
    var cuenta = {};
    camaras.forEach(function(b){
      ((COLS[b]||[])[ci] || []).forEach(function(it){
        cuenta[it.n.etapa] = (cuenta[it.n.etapa] || 0) + 1;
      });
    });
    var total = Object.keys(cuenta).reduce(function(s,k){ return s + cuenta[k]; }, 0);
    var dom = Object.keys(cuenta).sort(function(a,b){ return cuenta[b]-cuenta[a]; })[0];
    var etapa = (dom && total && cuenta[dom]/total >= .4) ? dom : null;
    var xi = x0 + GRID.colX[ci], wi = GRID.colW[ci];
    if (prev && prev.etapa && prev.etapa === etapa){
      prev.w = xi + wi - prev.x;
      prev.cols++;
    } else {
      prev = { x: xi, w: wi, etapa: etapa, cols: 1 };
      CABS.push(prev);
    }
  }
  /* Las ultimas columnas son el calculo DE CADA camara: arriba dicen origen y
     abajo revisora, asi que el encabezado compartido no puede decir una de las
     dos. Se rotula por lo que la columna ES, no por la etapa de la mayoria. */
  CABS.forEach(function(c){
    if (c.etapa === "origen" || c.etapa === "revisora") c.titulo = "Cálculo en la cámara";
    else if (c.etapa === "nowcast") c.titulo = "Resultado";
    else if (c.etapa) c.titulo = NOM_ETAPA[c.etapa];
  });
  if (CABS.length){
    var ult = CABS[CABS.length-1];
    ult.titulo = "Resultado de la cámara";
    ult.etapa = ult.etapa || "nowcast";
  }

  /* --- 6. lo condicionado por el paso previo ------------------------------ */
  /* Una caja por miembro y un solo titulo, en vez de una caja unica: los dos
     nodos condicionados no son vecinos (la Puerta D vive en la ultima columna),
     y una caja que los envuelva a los dos se traga media banda de nodos que NO
     estan condicionados. Marcar de mas es mentir. */
  CAJAS = [];
  (D.grupos || []).forEach(function(g){
    var dentro = INST.filter(function(it){
      return it.n.grupo === g.id && it.bloque === (g.bloque || it.bloque);
    });
    if (!dentro.length) return;
    dentro.sort(function(a,b){ return a.x - b.x; });
    var p = 9;
    dentro.forEach(function(it, i){
      CAJAS.push({ g:g, ancla: i === 0, dest: it === dentro[dentro.length-1],
                   x: it.x - it.w/2 - p, y: it.y - it.h/2 - p,
                   w: it.w + 2*p, h: it.h + 2*p });
    });
  });

  /* Lo plegado no cuenta para el encuadre: si no, «Ajustar» sigue reservando
     media pantalla para una banda que no se esta viendo. */
  var extra = document.body.dataset.extra !== "off";
  ANCHO = 0; ALTO = 0;
  MARCOS.forEach(function(m){
    if (m.id === "fuera" && !extra) return;
    ANCHO = Math.max(ANCHO, m.x + m.w + MARGEN);
    ALTO  = Math.max(ALTO,  m.y + m.h + MARGEN);
  });
}

/* ------------------------------------------------------------------ formas */
function forma(it){
  var n = it.n, w = it.w, h = it.h;
  var c = "var(--rol-" + n.rol + ")", f = "var(--rol-" + n.rol + "-bg)";
  var a = { class:"forma", fill:f, stroke:c };
  var tipo = FORMA_ROL[n.rol];
  if (tipo === "hexagono"){
    var ch = Math.min(20, w * .22);
    return el("polygon", Object.assign(a, { points:
      [[-w/2+ch,-h/2],[w/2-ch,-h/2],[w/2,0],[w/2-ch,h/2],[-w/2+ch,h/2],[-w/2,0]]
        .map(function(p){ return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ") }));
  }
  if (tipo === "circulo") return el("ellipse", Object.assign(a, { rx:w/2, ry:h/2 }));
  return el("rect", Object.assign(a, {
    x:-w/2, y:-h/2, width:w, height:h, rx: tipo === "rectangulo-grueso" ? 3 : 5 }));
}

function haloDe(it){
  if (FORMA_ROL[it.n.rol] === "circulo")
    return el("ellipse", { class:"halo", rx:it.w/2+7, ry:it.h/2+7 });
  return el("rect", { class:"halo", x:-it.w/2-7, y:-it.h/2-7,
                      width:it.w+14, height:it.h+14, rx:8 });
}

/* ----------------------------------------------------------------- aristas */
/* Dos ruteos, a propósito:
   - de una columna a la SIGUIENTE, dentro de la misma banda: codo ortogonal con
     esquinas redondeadas, con un carril propio en el hueco entre columnas. Es
     lo que hace que un diagrama se lea como un diagrama y no como una madeja.
   - todo lo demás (saltos de varias columnas, vueltas hacia atrás, lo que cruza
     de banda): curva. Un codo que atraviesa tres columnas pasa por encima de
     los nodos del medio; la curva los esquiva. */
function carriles(){
  var sale = {}, entra = {}, gaps = {};
  ARISTAS.forEach(function(a){
    (sale[a.de.clave] = sale[a.de.clave] || []).push(a);
    (entra[a.a.clave] = entra[a.a.clave] || []).push(a);
    a.orto = a.tipo !== "condiciona" && a.de.bloque === a.a.bloque &&
             a.de.col >= 0 && a.a.col === a.de.col + 1;
    if (a.orto){
      var k = a.de.bloque + "#" + a.de.col;
      (gaps[k] = gaps[k] || []).push(a);
    }
  });
  function repartir(mapa, campo, otro){
    Object.keys(mapa).forEach(function(k){
      var arr = mapa[k];
      var it = campo === "os" ? arr[0].de : arr[0].a;
      arr.sort(function(p,q){ return (p[otro].y - q[otro].y) || (p[otro].x - q[otro].x); });
      var n = arr.length, alto = Math.min(it.h - 12, (n-1) * 9);
      arr.forEach(function(a, i){ a[campo] = n === 1 ? 0 : -alto/2 + alto * (i/(n-1)); });
    });
  }
  repartir(sale, "os", "a");
  repartir(entra, "oe", "de");

  Object.keys(gaps).forEach(function(k){
    var arr = gaps[k];
    var ci = arr[0].de.col;
    var ini = GRID.x0 + GRID.colX[ci] + GRID.colW[ci];
    var fin = GRID.x0 + GRID.colX[ci+1];
    var util = Math.max(16, fin - ini);
    arr.sort(function(p,q){ return (p.de.y + p.a.y) - (q.de.y + q.a.y); });
    arr.forEach(function(a, i){
      a.xm = ini + util * ((i + 1) / (arr.length + 1));
    });
  });
}

function codo(x1, y1, x2, y2, xm){
  if (Math.abs(y1 - y2) < 1.5) return "M" + x1 + "," + y1 + " L" + x2 + "," + y2;
  var r = Math.min(11, Math.abs(y2-y1)/2, Math.abs(xm-x1) - 1, Math.abs(x2-xm) - 1);
  if (!(r > 1)) return "M" + x1 + "," + y1 + " L" + xm + "," + y1 +
                       " L" + xm + "," + y2 + " L" + x2 + "," + y2;
  var dy = y2 > y1 ? 1 : -1;
  return "M" + x1 + "," + y1 +
         " L" + (xm - r) + "," + y1 +
         " Q" + xm + "," + y1 + " " + xm + "," + (y1 + r*dy) +
         " L" + xm + "," + (y2 - r*dy) +
         " Q" + xm + "," + y2 + " " + (xm + r) + "," + y2 +
         " L" + x2 + "," + y2;
}

function caminoArista(a){
  var p = a.de, q = a.a;
  if (a.tipo === "condiciona") return caminoCondiciona(a);
  var y1 = p.y + (a.os || 0), y2 = q.y + (a.oe || 0);
  var x1 = p.x + p.w/2 + 2, x2 = q.x - q.w/2 - 7;
  if (a.orto && a.xm != null && x2 > x1 + 10) return codo(x1, y1, x2, y2, a.xm);
  if (x2 <= x1 + 12){
    var xa = p.x, xb = q.x;
    var dip = Math.max(46, Math.abs(q.y - p.y) * .35 + 34);
    return "M" + xa + "," + (p.y + p.h/2) +
           " C" + xa + "," + (p.y + p.h/2 + dip) + " " +
                  xb + "," + (q.y + q.h/2 + dip) + " " +
                  xb + "," + (q.y + q.h/2 + 4);
  }
  var mx = (x1 + x2) / 2;
  return "M" + x1 + "," + y1 + " C" + mx + "," + y1 + " " + mx + "," + y2 + " " +
         x2 + "," + y2;
}

/* El condicionamiento entre cámaras: una flecha corta y gruesa que BAJA del
   resultado de origen al recuadro de lo condicionado en la revisora. Con las
   bandas apiladas queda a la vista sin tener que rodear el dibujo entero. */
function caminoCondiciona(a){
  var p = a.de, q = a.a;
  var caja = CAJAS.filter(function(c){ return c.g.id === q.n.grupo && c.dest; })[0];
  var dx = caja ? caja.x + caja.w/2 : q.x;
  var dy = caja ? caja.y : q.y - q.h/2;
  var y0 = p.y + p.h/2 + 2, y1 = dy - 10;
  var med = (y0 + y1) / 2;
  return "M" + p.x + "," + y0 +
         " C" + p.x + "," + med + " " + dx + "," + med + " " + dx + "," + y1;
}

function marcadores(){
  var defs = $("#defs");
  defs.textContent = "";
  [["flujo","var(--arista)",6],["config","var(--line2)",6],
   ["calcula","var(--arista-fuerte)",6],["alerta","var(--alerta)",6],
   ["condiciona","var(--condiciona)",5],["vivo","var(--resalte)",6]].forEach(function(par){
    var m = el("marker", { id:"fl-"+par[0], viewBox:"0 0 10 10", refX:"9", refY:"5",
      markerWidth:par[2], markerHeight:par[2], orient:"auto-start-reverse" });
    m.appendChild(el("path", { d:"M0,1 L9,5 L0,9 z", fill:par[1] }));
    defs.appendChild(m);
  });
}
/* ------------------------------------------------------------------ dibujo */
var gMar = $("#capaMarcos"), gRej = $("#capaRejilla"), gGr = $("#capaGrupos"),
    gAr  = $("#capaAristas"), gNo = $("#capaNodos");

function dibujar(){
  marcadores();
  carriles();
  gMar.textContent = ""; gRej.textContent = ""; gGr.textContent = "";
  gAr.textContent = ""; gNo.textContent = "";

  /* --- las bandas: una por camara, misma grilla ------------------------- */
  MARCOS.forEach(function(m){
    var g = el("g", { class:"b-"+m.id+"-grupo" });
    g.appendChild(el("rect", { class:"marco b-"+m.id, x:m.x, y:m.y,
                               width:m.w, height:m.h, rx:14 }));
    if (m.num){
      var num = el("text", { class:"bandaNum", x:m.x + 18, y:m.y + 30 });
      num.textContent = m.num;
      g.appendChild(num);
    }
    var t = el("text", { class:"bandaTit", x:m.x + (m.num ? 42 : 18), y:m.y + 24 });
    t.textContent = m.nombre.toUpperCase();
    g.appendChild(t);
    if (m.sub){
      var s = el("text", { class:"bandaSub", x:m.x + (m.num ? 42 : 18), y:m.y + 38 });
      s.textContent = m.sub;
      g.appendChild(s);
    }
    gMar.appendChild(g);
  });

  /* --- la grilla compartida: encabezado arriba y verticales al fondo ----- */
  var yA = GRID.y0, yB = GRID.y1;
  CABS.forEach(function(c, i){
    if (c.etapa){
      gRej.appendChild(el("rect", { class:"cabCol", x:c.x - 10, y:yA - CAB_H,
                                    width:c.w + 20, height:CAB_H, rx:7 }));
      var t = el("text", { class:"cabColTxt", x:c.x + c.w/2, y:yA - CAB_H/2 + 4,
                           "text-anchor":"middle" });
      t.textContent = (c.titulo || NOM_ETAPA[c.etapa] || "").toUpperCase();
      var ti = el("title"); ti.textContent = DESC_ETAPA[c.etapa] || "";
      t.appendChild(ti);
      gRej.appendChild(t);
    }
    if (i){
      var x = c.x - GAP_COL/2 - 10;
      gRej.appendChild(el("line", { class:"rejilla", x1:x, y1:yA - CAB_H, x2:x, y2:yB }));
    }
  });

  /* --- lo condicionado por el paso previo -------------------------------- */
  CAJAS.forEach(function(c){
    gGr.appendChild(el("rect", { class:"grupoCaja", x:c.x, y:c.y,
                                 width:c.w, height:c.h, rx:16 }));
    if (!c.ancla) return;
    var t = el("text", { class:"grupoTit", x:c.x + 2, y:c.y - 6 });
    t.textContent = c.g.nombre;
    var ti = el("title"); ti.textContent = c.g.descripcion || "";
    t.appendChild(ti);
    gGr.appendChild(t);
  });

  /* --- aristas ----------------------------------------------------------- */
  ARISTAS.forEach(function(a, i){
    var atras = a.tipo !== "condiciona" && !a.orto &&
                (a.a.x - a.a.w/2) <= (a.de.x + a.de.w/2 + 12);
    var lejos = a.tipo !== "condiciona" && !a.orto &&
                (a.cruza || Math.abs(a.a.y - a.de.y) > 300 ||
                 Math.abs(a.a.x - a.de.x) > 700);
    var p = el("path", { class:"arista t-" + a.tipo + (atras ? " atras" : "") +
                                (lejos ? " lejos" : "") +
                                (a.de.bloque === "fuera" || a.a.bloque === "fuera"
                                  ? " b-fuera-grupo" : ""),
      d: caminoArista(a), "marker-end":"url(#fl-" + a.tipo + ")" });
    p.dataset.de = a.de.id; p.dataset.a = a.a.id;
    p.dataset.dek = a.de.clave; p.dataset.ak = a.a.clave;
    p.dataset.tipo = a.tipo; p.dataset.i = i;
    var tit = el("title");
    tit.textContent = a.de.n.label + " → " + a.a.n.label +
      " (" + NOM_TIPO[a.tipo] + (a.l.nota ? ": " + a.l.nota : "") + ")";
    p.appendChild(tit);
    gAr.appendChild(p);
    if (a.tipo === "condiciona" && a.l.nota){
      var caja = CAJAS.filter(function(c){ return c.g.id === a.a.n.grupo && c.dest; })[0];
      var mx = (a.de.x + (caja ? caja.x + caja.w/2 : a.a.x)) / 2;
      var my = (a.de.y + a.de.h/2 + (caja ? caja.y : a.a.y)) / 2;
      var fondo = el("rect", { class:"rotFondo", x:mx - 150, y:my - 13,
                               width:300, height:20, rx:9 });
      gAr.appendChild(fondo);
      var r = el("text", { class:"rotArista", x:mx, y:my + 2, "text-anchor":"middle" });
      r.textContent = a.l.nota;
      gAr.appendChild(r);
    }
  });

  /* --- nodos ------------------------------------------------------------- */
  INST.forEach(function(it){
    var n = it.n;
    var g = el("g", { class:"nodo r-" + n.rol +
                            (it.bloque === "fuera" ? " b-fuera-grupo" : ""),
      transform:"translate("+it.x+","+it.y+")", tabindex:"0", role:"button" });
    g.dataset.id = n.id; g.dataset.clave = it.clave;
    g.setAttribute("aria-label", rotuloAccesible(it));
    g.appendChild(haloDe(it));
    g.appendChild(forma(it));

    var altoTxt = it.lineas.length * 14 + it.sublineas.length * 11;
    var y = -altoTxt/2 + 11;
    var t = el("text", { class:"rotulo", "text-anchor":"middle" });
    it.lineas.forEach(function(s, k){
      var ts = el("tspan", { x:0, y: y + k*14 });
      ts.textContent = s; t.appendChild(ts);
    });
    g.appendChild(t);
    if (it.sublineas.length){
      var t2 = el("text", { class:"sub", "text-anchor":"middle" });
      it.sublineas.forEach(function(s, k){
        var ts2 = el("tspan", { x:0, y: y + it.lineas.length*14 + k*11 });
        ts2.textContent = s; t2.appendChild(ts2);
      });
      g.appendChild(t2);
    }
    if (it.compartido){
      var mk = el("text", { class:"gemelo", x: it.w/2 - 9, y: -it.h/2 + 11,
                            "text-anchor":"end" });
      mk.textContent = "⇄";
      var mt = el("title");
      mt.textContent = "Alimenta a las dos cámaras: el mismo nodo está dibujado " +
        "en la otra banda, en esta misma columna.";
      mk.appendChild(mt);
      g.appendChild(mk);
    }
    if (n.parqueada) g.classList.add("parqueada");
    var tit = el("title");
    tit.textContent = n.label + " — " + NOM_ROL[n.rol] +
      (n.estado ? " · " + n.estado : "") +
      (n.owner && n.owner !== "—" ? " · " + n.owner : "");
    g.appendChild(tit);
    gNo.appendChild(g);
    it.g = g;
  });
}

function rotuloAccesible(it){
  var n = it.n;
  var p = [n.label, NOM_ROL[n.rol], "etapa " + NOM_ETAPA[n.etapa]];
  var b = BLOQUES.filter(function(x){ return x.id === it.bloque; })[0];
  if (b) p.push(b.nombre);
  if (it.compartido) p.push("alimenta a las dos cámaras");
  if (n.estado) p.push("estado " + n.estado);
  if (n.owner && n.owner !== "—") p.push("dueño " + n.owner);
  if (n.suspendida) p.push("suspendida: no se modela");
  else if (n.parqueada) p.push("parqueado o inexistente");
  if (n.archivo) p.push("archivo " + n.archivo);
  var e = (ENTRAN[n.id]||[]).length, s = (SALEN[n.id]||[]).length;
  p.push(e + " entradas, " + s + " salidas");
  return p.join(". ");
}

/* ------------------------------------------------------------------ filtros */
function visible(n){
  if (!S.etapas.has(n.etapa) || !S.roles.has(n.rol)) return false;
  if (!S.q) return true;
  var heno = [n.label, n.sublabel, n.que_es, n.archivo, n.archivo_externo, n.modulo,
              n.owner, n.estado, n.formula, (n.notas||[]).join(" ")].join(" ").toLowerCase();
  return heno.indexOf(S.q) >= 0;
}

function nodosDelCamino(){
  if (!S.camino) return null;
  var c = (D.caminos||[]).filter(function(x){ return x.id === S.camino; })[0];
  return c ? new Set(c.nodos) : null;
}

function pintar(){
  var camino = nodosDelCamino();
  var vecinos = null;
  if (S.sel){
    vecinos = new Set([S.sel]);
    (ENTRAN[S.sel]||[]).forEach(function(l){ vecinos.add(l.de); });
    (SALEN[S.sel]||[]).forEach(function(l){ vecinos.add(l.a); });
  }

  INST.forEach(function(it){
    var n = it.n, v = visible(n);
    if (camino && !camino.has(n.id)) v = false;
    if (vecinos && !vecinos.has(n.id)) v = v && !S.sel;
    it.g.classList.toggle("apagado", !v);
    it.g.classList.toggle("sel", n.id === S.sel);
    it.g.classList.toggle("enCamino", !!(camino && camino.has(n.id)));
    it.g.setAttribute("tabindex", v ? "0" : "-1");
    it._v = v;
  });

  Array.prototype.forEach.call(gAr.children, function(p){
    if (p.tagName !== "path") return;
    var de = POR_CLAVE[p.dataset.dek], a = POR_CLAVE[p.dataset.ak];
    var vivos = de && a && de._v && a._v;
    var enCamino = camino && camino.has(p.dataset.de) && camino.has(p.dataset.a);
    var tocaSel = S.sel && (p.dataset.de === S.sel || p.dataset.a === S.sel);
    p.classList.toggle("apagada", !vivos);
    p.classList.toggle("viva", !!(enCamino || tocaSel));
    p.setAttribute("marker-end",
      (enCamino || tocaSel) ? "url(#fl-vivo)" : "url(#fl-" + p.dataset.tipo + ")");
  });
}

/* ------------------------------------------------------------------ ficha */
/* Lo más útil de la página. Por cada nodo contesta: qué es, qué archivo lo
   produce, qué consume, quién lo consume, en qué estado está y cuál es su
   trampa conocida. */
function abrir(id){
  S.sel = id;
  var n = IDX[id];
  var f = $("#ficha");
  var h = [];
  h.push('<button class="btn cerrar" id="b-cerrar" aria-label="Cerrar la ficha">✕</button>');
  h.push('<span class="rolbadge r-'+n.rol+'">'+esc(NOM_ROL[n.rol])+'</span> ');
  h.push('<span class="badge e-'+String(n.estado||"").replace(/\s/g,"")+'">'+
         esc(n.estado || "sin estado declarado")+'</span>');
  if (n.suspendida) h.push('<span class="badge b-susp">SUSPENDIDA</span>');
  if ((MIEMBRO[id]||[]).length > 1) h.push('<span class="badge b-comp">las dos cámaras</span>');
  h.push('<h2>'+esc(n.label)+'</h2>');
  if (n.sublabel) h.push('<div class="via">'+esc(n.sublabel)+'</div>');
  h.push('<div class="via">'+esc(NOM_ETAPA[n.etapa])+
         (n.modulo ? ' · módulo <code>'+esc(n.modulo)+'</code>'+
            (n.modulo_inferido ? ' <span class="via">(deducido del path)</span>' : '') : '')+
         '</div>');

  h.push('<p class="qes">'+esc(n.que_es || "")+'</p>');

  if (n.formula) h.push('<h3>Fórmula</h3><span class="formula">'+esc(n.formula)+'</span>');

  if (n.grupo && GRUPOS[n.grupo])
    h.push('<div class="nota cond"><b>'+esc(GRUPOS[n.grupo].nombre)+'.</b> '+
           esc(GRUPOS[n.grupo].descripcion || "")+'</div>');
  if (n.suspendida)
    h.push('<div class="nota mala"><b>Suspendida.</b> No se modela. '+
           esc(n.estado_motivo || "")+'</div>');
  else if (n.parqueada && !n.es_hueco)
    h.push('<div class="nota mala"><b>Parqueada.</b> Se ve, y se ve que no está. '+
           'Existe como decisión escrita, no como código.</div>');
  if (n.es_hueco)
    h.push('<div class="nota mala"><b>Hueco conocido.</b> Está en el mapa a propósito: '+
           'la carpeta está vacía o el tramo falta.</div>');

/* ------------------------------------------------------------------ zoom/pan */
var svg = $("#svg"), raiz = $("#raiz");
function aplicar(){
  raiz.setAttribute("transform",
    "translate("+S.px.toFixed(1)+","+S.py.toFixed(1)+") scale("+S.z.toFixed(3)+")");
}
/* El alto del lienzo se calcula contra la ventana real, no se hardcodea: la
   barra de instrumentos envuelve distinto segun el ancho. Sin esto, en una
   notebook baja el dibujo queda de miniatura. */
function altoLienzo(){
  var c = document.querySelector(".cuerpo");
  var arriba = 0, e = c;
  while (e){ arriba += e.offsetTop; e = e.offsetParent; }
  c.style.height = Math.max(500, window.innerHeight - arriba - 4) + "px";
}
function ajustar(){
  altoLienzo();
  var r = $("#lienzo").getBoundingClientRect();
  var z = Math.min((r.width - 20) / ANCHO, (r.height - 20) / ALTO);
  S.z = Math.max(.10, Math.min(1.6, z));
  S.px = (r.width - ANCHO * S.z) / 2;
  S.py = Math.max(8, (r.height - ALTO * S.z) / 2);
  aplicar();
}
function zoomA(f, cx, cy){
  var r = $("#lienzo").getBoundingClientRect();
  cx = cx == null ? r.width/2 : cx;
  cy = cy == null ? r.height/2 : cy;
  var nz = Math.max(.08, Math.min(4, S.z * f));
  S.px = cx - (cx - S.px) * (nz / S.z);
  S.py = cy - (cy - S.py) * (nz / S.z);
  S.z = nz; aplicar();
}
function centrarEn(id){
  var it = (POR_ID[id] || [])[0]; if (!it) return;
  var r = $("#lienzo").getBoundingClientRect();
  S.px = r.width/2 - it.x * S.z;
  S.py = r.height/2 - it.y * S.z;
  aplicar();
}

var arr = null;
svg.addEventListener("pointerdown", function(e){
  if (e.target.closest(".nodo")) return;
  arr = { x:e.clientX, y:e.clientY, px:S.px, py:S.py };
  svg.classList.add("arrastrando");
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", function(e){
  if (!arr) return;
  S.px = arr.px + (e.clientX - arr.x);
  S.py = arr.py + (e.clientY - arr.y);
  aplicar();
});
["pointerup","pointercancel"].forEach(function(ev){
  svg.addEventListener(ev, function(){ arr = null; svg.classList.remove("arrastrando"); });
});
svg.addEventListener("wheel", function(e){
  e.preventDefault();
  var r = $("#lienzo").getBoundingClientRect();
  zoomA(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX - r.left, e.clientY - r.top);
}, { passive:false });

/* Acá abajo va todo lo que antes ocupaba el cromo de arriba: las formas, los
   tipos de línea, los estados y LAS DOS FORMULACIONES. Siguen enteras -que sean
   dos es el punto del mapa- pero en chico y sin jerarquía de titular. */
function leyenda(){
  function mini(rol){
    var c = "var(--rol-"+rol+")", f = "var(--rol-"+rol+"-bg)";
    var forma = FORMA_ROL[rol];
    if (forma === "hexagono")
      return '<svg width="30" height="20" aria-hidden="true"><polygon points="6,3 22,3 28,10 22,17 6,17 0,10" fill="'+f+'" stroke="'+c+'" stroke-width="2"/></svg>';
    if (forma === "circulo")
      return '<svg width="30" height="20" aria-hidden="true"><ellipse cx="15" cy="10" rx="13" ry="8" fill="'+f+'" stroke="'+c+'" stroke-width="2"/></svg>';
    if (forma === "rectangulo-grueso")
      return '<svg width="30" height="20" aria-hidden="true"><rect x="2.5" y="3.5" width="25" height="13" rx="2" fill="'+f+'" stroke="'+c+'" stroke-width="4"/></svg>';
    return '<svg width="30" height="20" aria-hidden="true"><rect x="1.5" y="3.5" width="27" height="13" rx="3" fill="'+f+'" stroke="'+c+'" stroke-width="2"/></svg>';
  }
  function linea(clase){
    return '<svg width="38" height="12" aria-hidden="true"><line x1="1" y1="6" x2="37" y2="6" '+
           'class="arista '+clase+'" /></svg>';
  }
  var h = [];

  h.push('<div class="ley"><h4>La forma dice qué es</h4>' +
    D.roles.map(function(r){
      return '<div>'+mini(r.id)+'<span><b>'+esc(r.nombre)+'</b> — '+esc(r.descripcion)+'</span></div>';
    }).join("") +
    '<div><span class="gemelo" style="font-size:14px">⇄</span>'+
    '<span>El nodo alimenta a las <b>dos cámaras</b> y está dibujado de los dos lados. '+
    'Es el mismo nodo: al seleccionarlo se encienden las dos copias.</span></div>'+
    '<div><svg width="30" height="20" aria-hidden="true"><ellipse cx="15" cy="10" rx="13" ry="8" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/></svg>'+
    '<span><b>Borde punteado</b> — parqueada, suspendida o hueco conocido. Se ve, y se ve '+
    'que no está.</span></div></div>');

  h.push('<div class="ley"><h4>La línea dice cómo se conecta</h4>' +
    '<div>'+linea("t-flujo")+'<span><b>Llena</b> — flujo de datos: el dato pasa de un nodo al otro.</span></div>' +
    '<div>'+linea("t-calcula")+'<span><b>Llena y más gruesa</b> — composición aritmética: el destino se calcula con el origen.</span></div>' +
    '<div>'+linea("t-config")+'<span><b>Punteada</b> — realimentación o dependencia opcional: parametriza, no aporta el valor.</span></div>' +
    '<div>'+linea("t-alerta")+'<span><b>Punteada roja</b> — control o advertencia. NO es el valor publicado.</span></div>' +
    '<div>'+linea("t-condiciona")+'<span><b>Gruesa, por arriba</b> — el condicionamiento entre cámaras. '+
    'No es flujo de datos: en código no se pasa nada de un lado al otro, cambia el supuesto.</span></div>' +
    '<div><svg width="30" height="20" aria-hidden="true"><rect x="1.5" y="2.5" width="27" height="15" rx="5" fill="var(--grupo-bg)" stroke="var(--grupo)" stroke-width="2"/></svg>'+
    '<span><b>Recuadro resaltado</b> — lo que está condicionado por el paso previo.</span></div></div>');

  h.push('<div class="ley"><h4>Estados — cómo se lee el borde</h4>' +
    (D.estados||[]).map(function(e){
      return '<div><span class="badge e-'+e.replace(/\s/g,"")+'">'+esc(e)+'</span></div>';
    }).join("") +
    '<div><span>El color codifica el <b>rol</b>, nunca el estado: el estado va en el borde, '+
    'en la ficha y en la tabla gemela.</span></div>'+
    '<div><span>El estado de un nodo sale del <code>**Estado:**</code> del README de su módulo, '+
    'salvo que el nodo declare el suyo en la capa curada — y entonces la ficha dice cuál de '+
    'los dos está mostrando.</span></div></div>');

  h.push('<div class="ley"><h4>Las dos formulaciones que conviven</h4>' +
    (D.formulaciones||[]).map(function(f){
      return '<button class="form" type="button" aria-pressed="false" data-f="'+esc(f.id)+'">'+
        '<span class="n">'+esc(f.nombre)+' · '+esc(f.estado||"")+'</span>'+

    }).join("") + '</div>');

  $("#leyenda").innerHTML = h.join("");

  Array.prototype.forEach.call($("#leyenda").querySelectorAll(".form"), function(b){

      var id = b.dataset.f;

      S.camino = (S.camino === id) ? "" : (hay ? id : "");

      });

      if (cm){ S.sel = null; avisoCamino(cm); } else cerrar();
      pintar();
    });
  });
}

function chips(cont, items, set, clasePrefijo){
  var c = $(cont);
  items.forEach(function(it){
    var b = document.createElement("button");
    b.className = "chip" + (clasePrefijo ? " " + clasePrefijo + it.id : "");
    b.type = "button";
    b.setAttribute("aria-pressed", "true");
    b.innerHTML = (clasePrefijo ? '<span class="pin" aria-hidden="true"></span>' : "") + esc(it.nombre);
    b.addEventListener("click", function(){
      var on = b.getAttribute("aria-pressed") === "true";
      b.setAttribute("aria-pressed", on ? "false" : "true");
      if (on) set.delete(it.id); else set.add(it.id);
      pintar();
    });
    c.appendChild(b);
  });
}

    var on = document.body.dataset.extra === "on";
    document.body.dataset.extra = on ? "off" : "on";
    this.textContent = "Controles: " + (on ? "no" : "sí");
    this.setAttribute("aria-pressed", on ? "false" : "true");
    colocar(); dibujar(); pintar(); ajustar();
    if (S.sel) abrir(S.sel);
  });
  $("#b-tema").addEventListener("click", function(){
    var osc = document.body.dataset.tema === "oscuro";
    document.body.dataset.tema = osc ? "claro" : "oscuro";
    this.textContent = osc ? "Tema oscuro" : "Tema claro";
  });
  $("#b-vista").addEventListener("click", function(){
    var t = document.body.dataset.vista === "tabla";
    document.body.dataset.vista = t ? "grafo" : "tabla";
    this.textContent = t ? "Ver tabla" : "Ver dibujo";
    this.setAttribute("aria-pressed", t ? "false" : "true");
    if (!t) $("#tabla").focus();
  });
  $("#b-mas").addEventListener("click", function(){ zoomA(1.25); });
  $("#b-menos").addEventListener("click", function(){ zoomA(1/1.25); });
  $("#b-ajustar").addEventListener("click", ajustar);
  $("#b-reordenar").addEventListener("click", function(){
    /* Empuja el orden con una permutación chica y vuelve a converger: sirve
       para salir de un mínimo local feo sin cambiar los datos. */
    BLOQUES.forEach(function(b){
      (COLS[b.id] || []).forEach(function(col){
        if (col.length > 3){
          var i = 1 + Math.floor(Math.random()*(col.length-2));
          var t = col[i]; col[i] = col[i-1]; col[i-1] = t;
        }
      });
      ordenar(b.id, 8);
    });
    INST.forEach(function(it){ it.x = 0; it.y = 0; });
    colocar(); dibujar(); pintar();
    if (S.sel) abrir(S.sel);
  });
  $("#b-pantalla").addEventListener("click", function(){
    var l = $("#lienzo");
    if (document.fullscreenElement) document.exitFullscreen();
    else if (l.requestFullscreen) l.requestFullscreen();
  });

  gNo.addEventListener("click", function(e){
    var g = e.target.closest(".nodo");
    if (g) { $("#camino").value = ""; S.camino = ""; abrir(g.dataset.id); }
  });
  gNo.addEventListener("keydown", function(e){
    var g = e.target.closest(".nodo");
    if (!g) return;
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); abrir(g.dataset.id); }
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") cerrar();
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "+" || e.key === "=") zoomA(1.25);
    if (e.key === "-") zoomA(1/1.25);
    if (e.key === "0") ajustar();
  });
  window.addEventListener("resize", function(){ if (!arr) ajustar(); });
  document.addEventListener("fullscreenchange", function(){ setTimeout(ajustar, 60); });
}

function avisoCamino(c){
  var f = $("#ficha");
  f.innerHTML = '<button class="btn cerrar" id="b-cerrar" aria-label="Cerrar">✕</button>' +
    '<h2>'+esc(c.nombre)+'</h2><p class="qes">'+esc(c.descripcion)+'</p>' +
    '<h3>Los pasos, en orden</h3><ol style="padding-left:18px;font-size:.86rem">' +
    c.nodos.map(function(id){
      var n = IDX[id];
      return '<li style="margin-bottom:6px"><button class="vinculo" data-ir="'+esc(id)+'">'+
             esc(n.label)+'</button>'+
             (n.formula ? '<br><code>'+esc(n.formula)+'</code>' : '') +
             (n.archivo ? '<br><span class="via">'+esc(n.archivo)+'</span>' : '')+'</li>';
    }).join("") + '</ol>';
  f.classList.add("on");
  $("#b-cerrar").addEventListener("click", function(){
    $("#camino").value = ""; S.camino = ""; cerrar();
  });
  Array.prototype.forEach.call(f.querySelectorAll(".vinculo"), function(b){
    b.addEventListener("click", function(){ centrarEn(b.dataset.ir); abrir(b.dataset.ir); });
  });
}
